name: Validate portable core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s plugins/memorial-modelo-3d/skills/memorial-modelo-3d/adapters/rhino -p test_extract_rhino.py -v
      - run: python -m compileall -q plugins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plugins/memorial-modelo-3d/skills/memorial-modelo-3d/scripts/build_memorial.mjs
